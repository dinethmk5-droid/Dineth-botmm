<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DINETH_MD_Mini_Bot - Get Session</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f1020;color:#eee;font-family:system-ui,Segoe UI,Roboto,sans-serif;padding:16px}
  .card{width:100%;max-width:440px;background:#181a33;border:1px solid #2c2f55;border-radius:16px;padding:22px;text-align:center}
  .card>img{width:120px;height:120px;object-fit:cover;border-radius:50%;border:2px solid #5b5fe0}
  h1{font-size:20px;margin:12px 0 4px;word-break:break-word}
  p.sub{margin:0 0 16px;color:#9aa0d0;font-size:14px}
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tabs button{flex:1;padding:10px;border-radius:10px;border:1px solid #2c2f55;background:#12142a;color:#cfd2ff;font-size:14px;cursor:pointer}
  .tabs button.on{background:#5b5fe0;color:#fff;border-color:#5b5fe0}
  input{width:100%;padding:12px;border-radius:10px;border:1px solid #2c2f55;background:#0f1020;color:#fff;font-size:16px;margin-bottom:10px}
  .go{width:100%;padding:12px;border:0;border-radius:10px;background:#5b5fe0;color:#fff;font-size:16px;cursor:pointer}
  .go:disabled{opacity:.5}
  #out{margin-top:16px;font-size:14px;word-break:break-all}
  .code{font-size:32px;letter-spacing:4px;font-weight:700;color:#8fffb0;margin:8px 0}
  textarea{width:100%;height:120px;background:#0f1020;color:#8fffb0;border:1px solid #2c2f55;border-radius:10px;padding:10px;font-size:12px}
  .err{color:#ff8a8a}.hint{color:#9aa0d0;font-size:13px;line-height:1.5;margin-top:8px}
  .warn{color:#ffd37a;font-size:12px;margin-top:8px}
  #qrimg{width:240px;height:240px;background:#fff;border-radius:10px;padding:8px}
</style>
</head>
<body>
<div class="card">
  <img id="logo" alt="logo" src="https://files.catbox.moe/20uiui.png">
  <h1>𝑫𝑰𝑵𝑬𝑻𝑯_𝑴𝑫_𝑴𝒊𝒏𝒊_𝑩𝒐𝒕</h1>
  <p class="sub">Get your SESSION_ID</p>

  <div class="tabs">
    <button id="tCode" class="on">Pair code</button>
    <button id="tQr">QR code</button>
  </div>

  <div id="pCode">
    <input id="num" inputmode="numeric" placeholder="Your number with country code e.g. 94771234567">
    <button class="go" id="go">Get pair code</button>
  </div>
  <div id="pQr" hidden>
    <button class="go" id="goQr">Show QR code</button>
  </div>

  <div id="out"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let timer = null;

function tab(code) {
  $("tCode").classList.toggle("on", code);
  $("tQr").classList.toggle("on", !code);
  $("pCode").hidden = !code;
  $("pQr").hidden = code;
  clearInterval(timer);
  $("out").textContent = "";
}
$("tCode").onclick = () => tab(true);
$("tQr").onclick = () => tab(false);

async function begin(url, body, btn) {
  clearInterval(timer);
  btn.disabled = true;
  $("out").textContent = "Please wait...";
  try {
    const r = await fetch(url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body || {}) });
    const j = await r.json();
    if (!r.ok) { show("err", j.error || "Error"); btn.disabled = false; return; }
    timer = setInterval(() => poll(j.id, btn), 2000);
  } catch (e) { show("err", "Network error"); btn.disabled = false; }
}

async function poll(id, btn) {
  try {
    const r = await fetch("/api/status/" + id);
    const s = await r.json();
    render(s);
    if (s.status === "linked" || s.status === "error") { clearInterval(timer); btn.disabled = false; }
  } catch (e) {}
}

function show(cls, text) {
  const d = document.createElement("div");
  d.className = cls; d.textContent = text;
  $("out").replaceChildren(d);
}

function render(s) {
  const out = $("out");
  if (s.status === "error") return show("err", s.error || "Error");
  if (s.status === "starting") return show("hint", "Starting...");
  if (s.status === "linked") {
    const wrap = document.createElement("div");
    const ok = document.createElement("div"); ok.textContent = "✅ Linked! Your SESSION_ID:";
    const ta = document.createElement("textarea"); ta.readOnly = true; ta.value = s.sessionId;
    const cp = document.createElement("button"); cp.className = "go"; cp.textContent = "Copy SESSION_ID";
    cp.onclick = async () => { try { await navigator.clipboard.writeText(s.sessionId); cp.textContent = "Copied ✔"; } catch (e) { ta.select(); } };
    const w = document.createElement("div"); w.className = "warn";
    w.textContent = "⚠️ Never share this with anyone. It was also sent to your own WhatsApp chat.";
    wrap.append(ok, ta, cp, w);
    return out.replaceChildren(wrap);
  }
  // waiting
  const wrap = document.createElement("div");
  if (s.code) {
    const c = document.createElement("div"); c.className = "code"; c.textContent = s.code;
    const h = document.createElement("div"); h.className = "hint";
    h.textContent = "WhatsApp → Settings → Linked devices → Link a device → 'Link with phone number instead' → enter this code.";
    wrap.append(c, h);
  } else if (s.qr) {
    const i = document.createElement("img"); i.id = "qrimg"; i.alt = "QR"; i.src = s.qr;
    const h = document.createElement("div"); h.className = "hint";
    h.textContent = "WhatsApp → Settings → Linked devices → Link a device → scan this QR (use another phone).";
    wrap.append(i, h);
  } else { return show("hint", "Preparing..."); }
  out.replaceChildren(wrap);
}

$("go").onclick = () => begin("/api/pair", { number: $("num").value }, $("go"));
$("goQr").onclick = () => begin("/api/qr", {}, $("goQr"));
</script>
</body>
</html>
